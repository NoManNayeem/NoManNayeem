<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Animated idea to research to development loop">
  <title>Nayeem's Day - Idea to Research to Development Loop</title>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1fd1a4" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20c863"/>
      <stop offset="55%" stop-color="#d4ff00"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Outer ring -->
  <circle cx="400" cy="400" r="270" fill="none" stroke="url(#ringStroke)" stroke-width="3" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Title -->
  <text x="400" y="88" text-anchor="middle" font-size="36" font-weight="bold" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#20c863" opacity="0.95">
    Nayeem's Day
  </text>

  <!-- Center labels -->
  <text x="400" y="395" text-anchor="middle" font-size="22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe" opacity="0.9">
    Idea &#8594; Research &#8594; Development
  </text>
  <text x="400" y="425" text-anchor="middle" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#94a3b8" opacity="0.8">
    Iterative loop from signal to shipping
  </text>

  <!-- Rotating group -->
  <g transform="translate(400 400)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>

      <!-- 1: Idea (target icon) -->
      <g transform="rotate(0) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#20c863" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Idea</text>
      </g>

      <!-- 2: Research (cpu icon) -->
      <g transform="rotate(45) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#d4ff00" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Research</text>
      </g>

      <!-- 3: Data & Prototype (database icon) -->
      <g transform="rotate(90) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Prototype</text>
      </g>

      <!-- 4: Development (code icon) -->
      <g transform="rotate(135) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#20c863" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Develop</text>
      </g>

      <!-- 5: Evaluate (check icon) -->
      <g transform="rotate(180) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#d4ff00" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3.1s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Evaluate</text>
      </g>

      <!-- 6: Deploy (package icon) -->
      <g transform="rotate(225) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#7c3aed" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3.3s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Deploy</text>
      </g>

      <!-- 7: Feedback (trending-up icon) -->
      <g transform="rotate(270) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#20c863" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Feedback</text>
      </g>

      <!-- 8: Scale (activity icon) -->
      <g transform="rotate(315) translate(0 -270)">
        <circle cx="0" cy="0" r="44" fill="#0b1220" stroke="#d4ff00" stroke-width="2.5">
          <animate attributeName="r" values="44;47;44" dur="3.7s" repeatCount="indefinite"/>
        </circle>
        <svg x="-14" y="-14" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <text x="0" y="66" text-anchor="middle" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#c7d2fe">Scale</text>
      </g>

    </g>
  </g>
</svg>
